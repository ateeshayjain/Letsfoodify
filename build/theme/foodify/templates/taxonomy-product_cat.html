<!-- wp:group {"tagName":"main","style":{"spacing":{"padding":{"top":"var:preset|spacing|60","bottom":"var:preset|spacing|80"}}},"layout":{"type":"constrained"}} -->
<main class="wp-block-group" style="padding-top:var(--wp--preset--spacing--60);padding-bottom:var(--wp--preset--spacing--80)">
<!-- The title and the intro sit on the WIDE rail, like the grid below them.
     Constrained, they render at content width and the page has two left
     edges — 20px apart at 1280 and 220px apart at 1920. .fd-lede keeps the
     intro to a readable measure. The wrapper is a DEFAULT-layout group,
     not a constrained one: constrained would re-centre each child at the
     content width, which is the drift being fixed. -->
<!-- wp:group {"align":"wide","layout":{"type":"default"}} -->
<div class="wp-block-group alignwide">
<!-- wp:query-title {"type":"archive","showPrefix":false,"fontSize":"3xl"} /-->
<!-- wp:term-description {"className":"fd-lede","textColor":"mute","fontSize":"md","style":{"spacing":{"margin":{"bottom":"var:preset|spacing|60"}}}} /-->
</div>
<!-- /wp:group -->

<!-- wp:columns {"align":"wide","className":"fd-shop","style":{"spacing":{"blockGap":{"left":"var:preset|spacing|60"}}}} -->
<div class="wp-block-columns alignwide fd-shop">
<!-- wp:column {"width":"232px","className":"fd-shop__filters"} -->
<div class="wp-block-column fd-shop__filters" style="flex-basis:232px">
<!-- Printed CLOSED (UX review 8 Nov, BROWSE-2): open on a phone, the filters
     filled the screen above the results, so ticking one showed no change. The
     script straight after this block opens it from 782px BEFORE first paint
     (it runs as the parser reaches it — no flash, no layout shift). Without
     JavaScript the summary is a "Filter" control at every width (style.css).
     .fd-filters__count holds the number of active filters ("Filter · 2"). -->
<!-- wp:details {"className":"fd-filters"} -->
<details class="wp-block-details fd-filters"><summary>Filter<span class="fd-filters__count"></span></summary>
<!-- WooCommerce's CURRENT filter blocks (product-filters): rendered on the
     server, counts included, driven by the Interactivity API. The older
     attribute-filter / price-filter blocks this template first used are React
     blocks that render nothing without their saved markup — on the first real
     WooCommerce render (13 Nov 2026) the filter column was empty, and they
     pulled ~55 scripts onto the page for it. "overlayMode":"off": the theme's
     own Filter control (the details element) is the phone pattern; WooCommerce's
     overlay would be a second one. The attribute id is 0 here and resolved per
     install from foodifyAttribute (inc/product-attributes.php). -->
<!-- wp:woocommerce/product-filters {"overlayMode":"off","className":"fd-filterset"} -->
<div class="wp-block-woocommerce-product-filters fd-filterset">
<!-- wp:woocommerce/product-filter-attribute {"attributeId":0,"foodifyAttribute":"prep","showCounts":true,"queryType":"or"} -->
<!-- wp:heading {"level":3,"className":"fd-filterset__title"} -->
<h3 class="wp-block-heading fd-filterset__title">Prep method</h3>
<!-- /wp:heading -->
<!-- wp:woocommerce/product-filter-checkbox-list /-->
<!-- /wp:woocommerce/product-filter-attribute -->
<!-- wp:woocommerce/product-filter-attribute {"attributeId":0,"foodifyAttribute":"dietary","showCounts":true,"queryType":"or"} -->
<!-- wp:heading {"level":3,"className":"fd-filterset__title"} -->
<h3 class="wp-block-heading fd-filterset__title">Dietary</h3>
<!-- /wp:heading -->
<!-- wp:woocommerce/product-filter-checkbox-list /-->
<!-- /wp:woocommerce/product-filter-attribute -->
<!-- wp:woocommerce/product-filter-price -->
<!-- wp:heading {"level":3,"className":"fd-filterset__title"} -->
<h3 class="wp-block-heading fd-filterset__title">Price</h3>
<!-- /wp:heading -->
<!-- wp:woocommerce/product-filter-price-slider {"showInputFields":true} /-->
<!-- /wp:woocommerce/product-filter-price -->
</div>
<!-- /wp:woocommerce/product-filters -->
</details>
<!-- /wp:details -->
<!-- wp:html -->
<script>if(matchMedia('(min-width:782px)').matches){document.querySelectorAll('details.fd-filters').forEach(function(d){d.open=true})}</script>
<!-- /wp:html -->
</div>
<!-- /wp:column -->
<!-- wp:column {"className":"fd-shop__results"} -->
<div class="wp-block-column fd-shop__results">
<!-- wp:group {"className":"fd-shop__toolbar","layout":{"type":"flex","justifyContent":"space-between","flexWrap":"wrap"}} -->
<div class="wp-block-group fd-shop__toolbar">
<!-- wp:woocommerce/product-results-count /-->
<!-- wp:group {"className":"fd-sort","layout":{"type":"flex","flexWrap":"nowrap"}} -->
<div class="wp-block-group fd-sort">
<!-- A real <label>, 16px. The select is WooCommerce's (catalog-sorting); it
     needs id="fd-orderby" from the catalog-sorting render filter for the label
     to bind — see the LOOK handoff. -->
<!-- wp:html -->
<label class="fd-sort__label" for="fd-orderby">Sort by</label>
<!-- /wp:html -->
<!-- wp:woocommerce/catalog-sorting /-->
</div>
<!-- /wp:group -->
</div>
<!-- /wp:group -->

</div>
