<!-- wp:group {"tagName":"main","style":{"spacing":{"padding":{"top":"var:preset|spacing|60","bottom":"var:preset|spacing|80"}}},"layout":{"type":"constrained"}} -->
<main class="wp-block-group" style="padding-top:var(--wp--preset--spacing--60);padding-bottom:var(--wp--preset--spacing--80)">
<!-- The account is on the WIDE rail (UX review 8 Nov, ACCOUNT-8): at content
     width the nav took 15rem of 760px and the orders table's actions stacked.
     A default-layout wide group, the same shape as the cart page's. The
     signed-out sign-in form centres itself at 26rem inside it. -->
<!-- wp:post-title {"level":1,"align":"wide","fontSize":"3xl"} /-->
<!-- wp:group {"align":"wide","layout":{"type":"default"}} -->
<div class="wp-block-group alignwide">
<!-- The account is WooCommerce's [woocommerce_my_account] SHORTCODE. It was
     written as wp:woocommerce/classic-shortcode {"shortcode":"my_account"} —
     but that block knows only "cart" and "checkout" and renders the CART for
     anything else, so on a real WooCommerce every account page showed the
     cart (found 13 Nov 2026; the prototype draws the account itself). -->
<!-- wp:shortcode -->
[woocommerce_my_account]
<!-- /wp:shortcode -->
</div>
<!-- /wp:group -->
</main>
<!-- /wp:group -->
