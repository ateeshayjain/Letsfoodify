<!-- The order-received page. In a block theme WooCommerce does NOT render this
     through the checkout page and its classic thankyou.php (which is what the
     theme and the prototype assumed until the first real order, 13 Nov 2026):
     it has a template of its own, order-confirmation, built from the blocks
     below. WooCommerce's default version prints the address twice — "Shipping
     address" and "Billing address" — for a shop that asks for one. This one
     prints it once, as "Delivery address", on the theme's rail.
     What happens next (the sentence under the heading) is
     woocommerce_thankyou_order_received_text, and the account offer and the
     COD instructions arrive through the additional-information block — both
     from inc/checkout-flow.php and inc/account.php, unchanged. -->
