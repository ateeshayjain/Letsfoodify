     title (veg mark + diet badges, product-display.php), rating, price + unit
     price + yield strip (+ "Contains:" when allergens are declared), then
     quantity + Add to cart — which must land in the first screen and a half on
     a phone — then, appended to the add-to-cart form by PHP and in this order:
     the PIN delivery check (delivery-estimate.php), the Offers line
     (offers.php), the sold-out alert form (stock-alerts.php) and the
     assurances (product-display.php, from the product's own shelf life and the
     COD gateway — no longer typed here, where one prep time and one shelf
     life were printed on every product, a 1-minute chutney included). The
     excerpt follows, then the tabs.
